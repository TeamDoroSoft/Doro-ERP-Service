spring:
  application:
    name: store-access-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${STORE_ACCESS_DB_URL:jdbc:postgresql://localhost:5432/store_access_db}
    username: ${STORE_ACCESS_DB_USERNAME:}
    password: ${STORE_ACCESS_DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${STORE_ACCESS_REDIS_HOST:localhost}
      port: ${STORE_ACCESS_REDIS_PORT:6379}
      username: ${STORE_ACCESS_REDIS_USERNAME:}
      password: ${STORE_ACCESS_REDIS_PASSWORD:}
      ssl:
        enabled: ${STORE_ACCESS_REDIS_SSL_ENABLED:false}
  session:
    timeout: ${STORE_ACCESS_SESSION_TIMEOUT:30m}
    data:
      redis:
        namespace: ${STORE_ACCESS_SESSION_NAMESPACE:doro:store-access:session}
        repository-type: indexed
        configure-action: none

doro:
  identity:
    password:
      memory-kib: ${STORE_ACCESS_IDENTITY_PASSWORD_MEMORY_KIB:19456}
      iterations: ${STORE_ACCESS_IDENTITY_PASSWORD_ITERATIONS:2}
      parallelism: ${STORE_ACCESS_IDENTITY_PASSWORD_PARALLELISM:1}
      salt-length: ${STORE_ACCESS_IDENTITY_PASSWORD_SALT_LENGTH:16}
      hash-length: ${STORE_ACCESS_IDENTITY_PASSWORD_HASH_LENGTH:32}
    hmac:
      rate-limit-secret: ${STORE_ACCESS_IDENTITY_HMAC_RATE_LIMIT_SECRET:}
      idempotency-secret: ${STORE_ACCESS_IDENTITY_HMAC_IDEMPOTENCY_SECRET:}
      kiosk-credential-secret: ${STORE_ACCESS_IDENTITY_HMAC_KIOSK_CREDENTIAL_SECRET:}
    rate-limit:
      account:
        capacity: ${STORE_ACCESS_IDENTITY_RATE_LIMIT_ACCOUNT_CAPACITY:5}
        refill-tokens: ${STORE_ACCESS_IDENTITY_RATE_LIMIT_ACCOUNT_REFILL_TOKENS:1}
        refill-interval: ${STORE_ACCESS_IDENTITY_RATE_LIMIT_ACCOUNT_REFILL_INTERVAL:1m}
      client-ip:
        capacity: ${STORE_ACCESS_IDENTITY_RATE_LIMIT_CLIENT_IP_CAPACITY:30}
        refill-tokens: ${STORE_ACCESS_IDENTITY_RATE_LIMIT_CLIENT_IP_REFILL_TOKENS:6}
        refill-interval: ${STORE_ACCESS_IDENTITY_RATE_LIMIT_CLIENT_IP_REFILL_INTERVAL:1m}
    security-history:
      retention-batch-size: ${STORE_ACCESS_IDENTITY_SECURITY_HISTORY_RETENTION_BATCH_SIZE:1000}
      retention-cron: ${STORE_ACCESS_IDENTITY_SECURITY_HISTORY_RETENTION_CRON:0 0 3 * * *}

server:
  port: ${STORE_ACCESS_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

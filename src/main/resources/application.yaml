spring:
  application:
    name: Doro-ERP-Service
  jpa:
    hibernate:
      # 스키마는 Flyway가 관리하고 JPA는 매핑 검증만 수행한다
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # DB 저장 시각은 UTC로 통일한다
          time_zone: UTC
  flyway:
    enabled: true

doro:
  catalog:
    bootstrap:
      # catalog_revision 초기화 Runner 실행 여부
      enabled: true
    media:
      # ADR-007: 배포당 업체 하나이므로 tenantId는 요청 파라미터가 아니라 배포 설정값이다
      tenant-id: ${DORO_CATALOG_MEDIA_TENANT_ID:local}
      bucket: ${DORO_CATALOG_MEDIA_BUCKET:dorosoft-product-media-local}
      region: ${DORO_CATALOG_MEDIA_REGION:ap-northeast-2}
      cloud-front-domain: ${DORO_CATALOG_MEDIA_CLOUD_FRONT_DOMAIN:media.local.dorosoft.example}
      cleanup:
        # 만료 PENDING Media 정리 Scheduler 실행 여부
        enabled: true
